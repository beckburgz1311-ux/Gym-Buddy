<header class="top"><button class="brand" onclick="go('home')"><i>🏋</i><span><b>GYM</b> BUDDY</span></button><button id="topAction" class="profile" onclick="go('settings')">A</button></header>

<script>
const KEY='gym-buddy-v2',ACTIVE='gym-buddy-active-v2';
const defaults={profile:{name:'',startWeight:0,targetWeight:0,unit:'kg'},weights:[],sessions:[],templates:[{id:'push',name:'PUSH DAY',focus:'Chest · Shoulders · Triceps',exercises:['Barbell Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Tricep Pushdown']},{id:'pull',name:'PULL DAY',focus:'Back · Rear Delts · Biceps',exercises:['Deadlift','Lat Pulldown','Seated Cable Row','Face Pull','Dumbbell Curl']},{id:'legs',name:'LEG DAY',focus:'Quads · Glutes · Hamstrings',exercises:['Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Standing Calf Raise']}]};
const full={id:'full',name:'FULL BODY',focus:'Strength · Conditioning · Everything',exercises:['Back Squat','Barbell Bench Press','Lat Pulldown','Romanian Deadlift','Overhead Press']};
const quick=['Barbell Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Tricep Pushdown','Deadlift','Lat Pulldown','Seated Cable Row','Face Pull','Dumbbell Curl','Back Squat','Romanian Deadlift','Leg Press','Leg Curl','Standing Calf Raise','Hip Thrust','Pull-Up','Chest Press'];
let data=load(),active=loadActive(),tab='home',timer;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));return p?{...defaults,...p,profile:{...defaults.profile,...p.profile},templates:p.templates?.length?p.templates:defaults.templates}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function loadActive(){try{return JSON.parse(localStorage.getItem(ACTIVE))}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));active?localStorage.setItem(ACTIVE,JSON.stringify(active)):localStorage.removeItem(ACTIVE);updateTop()}
function id(p='id'){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(s,opt){return new Intl.DateTimeFormat('en-GB',opt||{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s))}
function duration(s,e){const mins=Math.max(0,Math.floor(((e?new Date(e):new Date())-new Date(s))/60000)),h=Math.floor(mins/60);return h?`${h}h ${mins%60}m`:`${mins}m`}
function volume(s){return s.exercises.reduce((t,e)=>t+e.sets.reduce((n,x)=>n+(x.done?x.weight*x.reps:0),0),0)}
function setsDone(s){return s.exercises.reduce((t,e)=>t+e.sets.filter(x=>x.done).length,0)}
function oneRM(w,r){return w&&r?w*(1+r/30):0}
function bests(){const m={};data.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.filter(x=>x.done).forEach(x=>m[e.name]=Math.max(m[e.name]||0,oneRM(x.weight,x.reps)))));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function latestWeight(){return [...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0]?.weight||data.profile.startWeight||0}
function weekStart(){const d=new Date(),day=d.getDay()||7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day+1);return +d}
function streak(){if(!data.sessions.length)return 0;const set=new Set(data.sessions.map(s=>s.startedAt.slice(0,10))),d=new Date();d.setHours(0,0,0,0);if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);let n=0;while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function toast(msg){const el=document.getElementById('toast');el.textContent='✓ '+msg;el.classList.remove('hide');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.add('hide'),2200)}
function updateTop(){const b=document.getElementById('topAction');if(active){b.className='live';b.innerHTML='<span class="dot"></span> LIVE · '+duration(active.startedAt);b.onclick=()=>go('workout')}else{b.className='profile';b.textContent=(data.profile.name||'A').trim()[0].toUpperCase();b.onclick=()=>go('settings')}}
function go(next){tab=next;document.querySelectorAll('.nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();scrollTo(0,0)}
function render(){clearInterval(timer);updateTop();const app=document.getElementById('app');app.innerHTML=tab==='home'?home():tab==='workout'?workout():tab==='weight'?weight():tab==='history'?history():settings();if(tab==='workout'&&active)timer=setInterval(()=>{const e=document.getElementById('liveTime');if(e)e.textContent=duration(active.startedAt)},1000)}
function chart(entries,target){const pts=[...entries].sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);if(pts.length<2)return '<div class="empty"><b>Log two weigh-ins</b><p>Your trend line will appear here.</p></div>';let vals=pts.map(x=>x.weight);if(target)vals.push(target);const min=Math.min(...vals)-1,max=Math.max(...vals)+1,w=560,h=200,p=22,x=i=>p+i*(w-p*2)/Math.max(pts.length-1,1),y=v=>h-p-(v-min)/Math.max(max-min,1)*(h-p*2),path=pts.map((q,i)=>(i?'L':'M')+' '+x(i)+' '+y(q.weight)).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-label="Weight trend"><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#363b33"/>${target?`<line x1="${p}" x2="${w-p}" y1="${y(target)}" y2="${y(target)}" stroke="#ff6b2c" stroke-dasharray="7 7"/>`:''}<path d="${path}" fill="none" stroke="#d8ff39" stroke-width="4"/>${pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.weight)}" r="5" fill="#0d0e0d" stroke="#d8ff39" stroke-width="3"/>${i===0||i===pts.length-1?`<text x="${x(i)}" y="${y(q.weight)-12}" text-anchor="${i?'end':'start'}">${q.weight}${data.profile.unit}</text>`:''}`).join('')}</svg>`}
function empty(icon,title,text){return `<div class="empty"><i>${icon}</i><b>${title}</b><p>${text}</p></div>`}
function home(){const u=data.profile.unit,l=latestWeight(),diff=l&&data.profile.startWeight?Math.round((l-data.profile.startWeight)*10)/10:0,to=l&&data.profile.targetWeight?Math.round((l-data.profile.targetWeight)*10)/10:0,week=data.sessions.filter(s=>+new Date(s.startedAt)>=weekStart()),vol=week.reduce((n,s)=>n+volume(s),0),pbs=bests(),name=data.profile.name.trim().split(' ')[0];return `<section class="screen"><div class="hero"><p class="eyebrow">${fmtDate(new Date(),{weekday:'long',day:'numeric',month:'long'})}</p><h1>${name?`LET'S WORK, ${esc(name.toUpperCase())}.`:'BUILT, NOT GIVEN.'}</h1><p>Track the work. Watch the numbers move.</p></div><button class="start" onclick="showStart()"><span class="ico">🏋</span><span><small>READY?</small><b>START A WORKOUT</b></span><span>›</span></button><div class="stats"><article class="card stat"><span class="badge">⚖</span><small>BODY WEIGHT</small><strong>${l||'—'}<em>${l?u:''}</em></strong><p class="${diff<=0?'positive':'negative'}">${diff?`${diff>0?'↑':'↓'} ${Math.abs(diff)}${u} from start`:'Set your baseline'}</p></article><article class="card stat"><span class="badge orange">🔥</span><small>TRAINING STREAK</small><strong>${streak()}<em>days</em></strong><p>${week.length} sessions this week</p></article><article class="card stat wide"><span class="badge">▥</span><span><small>WEEKLY VOLUME</small><strong>${Math.round(vol).toLocaleString()}<em>${u}</em></strong></span><span class="bars">${[35,55,42,73,62,88,Math.min(100,25+week.length*18)].map(h=>`<i style="height:${h}%"></i>`).join('')}</span></article></div><section class="section"><div class="section-head"><div><span>THE CUT</span><h2>WEIGHT PROGRESS</h2></div><button onclick="go('weight')">LOG WEIGHT</button></div><article class="card progress-card"><div class="weight-line"><div><small class="label">CURRENT</small><b>${l||'—'}${l?u:''}</b></div><div class="to-go">◎ ${data.profile.targetWeight?Math.abs(to)+u+' to target':'Set a target'}</div></div>${chart(data.weights,data.profile.targetWeight)}</article></section><section class="section"><div class="section-head"><div><span>PROOF OF WORK</span><h2>PERSONAL BESTS</h2></div><button onclick="go('history')">VIEW ALL</button></div><div class="list">${pbs.length?pbs.slice(0,4).map((p,i)=>`<article class="card pb"><span class="rank">#${i+1}</span><div><b>${esc(p[0])}</b><small>Estimated 1-rep max</small></div><strong>${Math.round(p[1]*10)/10}<em>${u}</em></strong></article>`).join(''):empty('🏆','No records yet','Complete weighted sets and your strongest lifts will appear here.')}</div></section></section>`}
function newExercise(name){return{id:id('ex'),name,sets:[1,2,3].map(()=>({id:id('set'),weight:0,reps:0,done:false}))}}
function startWorkout(t){active={id:id('session'),name:t.name,startedAt:new Date().toISOString(),endedAt:'',notes:'',exercises:t.exercises.map(newExercise)};save();closeModal();go('workout')}
function showStart(){const ts=[...data.templates,...(data.templates.some(t=>t.id==='full')?[]:[full])];modal('PICK YOUR PAIN','Choose a routine or start from nothing.',`<div class="template-list">${ts.map((t,i)=>`<button class="template" onclick='startWorkout(${JSON.stringify(t).replace(/'/g,"&#39;")})'><span class="num">0${i+1}</span><span><b>${esc(t.name)}</b><small>${esc(t.focus)}</small></span><span>›</span></button>`).join('')}<button class="template" onclick="startWorkout({name:'CUSTOM SESSION',exercises:[]})"><span class="num">+</span><span><b>BLANK SESSION</b><small>Build it as you train</small></span><span>›</span></button></div>`)}
function workout(){if(!active)return `<section class="screen">${empty('🏋','No active workout','Pick a routine and start logging sets as you train.')}<button class="primary" onclick="showStart()">START WORKOUT</button></section>`;const u=data.profile.unit;return `<section class="screen"><div class="work-head"><div><p class="eyebrow"><span class="dot"></span> WORKOUT IN PROGRESS</p><input class="session-name" value="${esc(active.name)}" oninput="active.name=this.value;save()"><p class="work-meta"><span id="liveTime">${duration(active.startedAt)}</span> · ${setsDone(active)} sets done · ${Math.round(volume(active)).toLocaleString()}${u}</p></div><button class="icon-btn" onclick="discard()">✕</button></div><div class="exercise-stack">${active.exercises.map((e,ei)=>`<article class="card exercise"><header><span>${String(ei+1).padStart(2,'0')}</span><h2>${esc(e.name)}</h2><button onclick="removeExercise('${e.id}')">⌫</button></header><div class="set-table"><div class="set-head"><span>SET</span><span>${u.toUpperCase()}</span><span>REPS</span><span>DONE</span></div>${e.sets.map((s,si)=>`<div class="set-row ${s.done?'done':''}"><button class="set-no" onclick="removeSet('${e.id}','${s.id}')">${si+1}</button>${stepper(e.id,s,'weight',u==='kg'?2.5:5)}${stepper(e.id,s,'reps',1)}<button class="done-btn" onclick="setVal('${e.id}','${s.id}','done',${!s.done})">${s.done?'✓':''}</button></div>`).join('')}</div><button class="text-btn" onclick="addSet('${e.id}')">＋ ADD SET</button></article>`).join('')}</div>${active.exercises.length?'':empty('＋','Empty session','Add your first exercise, then smash it.')}<button class="outline-btn" onclick="showExercisePicker()">＋ ADD EXERCISE</button><article class="card notes"><span class="label">SESSION NOTES</span><textarea placeholder="Energy, form cues, pain, wins..." oninput="active.notes=this.value;save()">${esc(active.notes)}</textarea></article><button class="finish" onclick="finishWorkout()">✓ FINISH & SAVE WORKOUT</button></section>`}
function stepper(eid,s,f,step){return `<div class="stepper"><button onclick="setVal('${eid}','${s.id}','${f}',Math.max(0,${s[f]}-${step}))">−</button><input type="number" min="0" value="${s[f]||''}" placeholder="0" oninput="setVal('${eid}','${s.id}','${f}',Number(this.value),false)"><button onclick="setVal('${eid}','${s.id}','${f}',Math.round((${s[f]}+${step})*10)/10)">＋</button></div>`}
function findEx(eid){return active.exercises.find(e=>e.id===eid)}
function setVal(eid,sid,f,v,rerender=true){const s=findEx(eid).sets.find(x=>x.id===sid);s[f]=v;save();if(rerender)render()}
function addSet(eid){findEx(eid).sets.push({id:id('set'),weight:0,reps:0,done:false});save();render()}
function removeSet(eid,sid){const e=findEx(eid);if(e.sets.length<2)return;e.sets=e.sets.filter(s=>s.id!==sid);save();render()}
function removeExercise(eid){active.exercises=active.exercises.filter(e=>e.id!==eid);save();render()}
function discard(){if(confirm('Discard this active workout?')){active=null;save();go('home');toast('Workout discarded')}}
function finishWorkout(){if(!setsDone(active)){toast('Complete at least one set first');return}active.endedAt=new Date().toISOString();data.sessions.unshift(active);active=null;save();go('home');toast('Workout crushed and saved')}
function showExercisePicker(){modal('ADD EXERCISE','Pick one or type your own.',`<input id="exSearch" class="search" placeholder="Search or enter an exercise..." oninput="filterExercises(this.value)" autofocus><div id="picker" class="picker">${quick.map(n=>pickerRow(n)).join('')}</div>`);setTimeout(()=>document.getElementById('exSearch')?.focus(),50)}
function pickerRow(n){return `<button onclick="addExercise(decodeURIComponent('${encodeURIComponent(n)}'))"><i>🏋</i><b>${esc(n)}</b><i>＋</i></button>`}
function filterExercises(q){const m=quick.filter(n=>n.toLowerCase().includes(q.toLowerCase())),custom=q.trim()&&!quick.some(n=>n.toLowerCase()===q.trim().toLowerCase())?`<button onclick="addExercise(decodeURIComponent('${encodeURIComponent(q.trim())}'))"><i>＋</i><b>Add “${esc(q.trim())}”</b><i>＋</i></button>`:'';document.getElementById('picker').innerHTML=custom+m.map(pickerRow).join('')}
function addExercise(n){active.exercises.push(newExercise(n));save();closeModal();render()}
function weight(){const u=data.profile.unit,l=latestWeight(),st=data.profile.startWeight,t=data.profile.targetWeight,prog=st&&t&&l?Math.max(0,Math.min(100,(st-l)/(st-t)*100)):0,sorted=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="screen"><div class="hero"><p class="eyebrow">BODY COMPOSITION</p><h1>MAKE THE TREND YOUR FRIEND.</h1></div><article class="card weigh"><div class="big-weight"><input id="weightVal" type="number" inputmode="decimal" value="${l||''}" placeholder="0.0"><span>${u}</span></div><div class="fields"><label>DATE<input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>NOTE<input id="weightNote" placeholder="Morning, fasted..."></label></div><button class="primary" onclick="logWeight()">✓ LOG WEIGH-IN</button></article><section class="section"><div class="section-head"><div><span>THE JOURNEY</span><h2>PROGRESS</h2></div></div><article class="card goals"><div class="goal-values"><span><small class="label">START</small><b>${st||'—'}${st?u:''}</b></span><span><small class="label">CURRENT</small><b>${l||'—'}${l?u:''}</b></span><span><small class="label">TARGET</small><b>${t||'—'}${t?u:''}</b></span></div><div class="track"><i style="width:${prog}%"></i></div><div class="fields"><label>START WEIGHT<input type="number" value="${st||''}" onchange="profileNum('startWeight',this.value)"></label><label>TARGET WEIGHT<input type="number" value="${t||''}" onchange="profileNum('targetWeight',this.value)"></label></div>${chart(data.weights,t)}</article></section><section class="section"><div class="section-head"><div><span>CHECKPOINTS</span><h2>WEIGH-IN HISTORY</h2></div></div><div class="list">${sorted.length?sorted.map((x,i)=>{const p=sorted[i+1],d=p?Math.round((x.weight-p.weight)*10)/10:0;return `<article class="card row"><span class="date"><b>${new Date(x.date).getDate()}</b><small>${fmtDate(x.date,{month:'short'}).toUpperCase()}</small></span><div><b>${x.weight}${u}</b><small>${esc(x.note||fmtDate(x.date,{weekday:'long'}))}</small></div><span class="${d<=0?'positive':'negative'}">${d?(d>0?'+':'')+d+u:'BASE'}</span><button onclick="deleteWeight('${x.id}')">⌫</button></article>`}).join(''):empty('⚖','No weigh-ins','Log your first weight to begin the trend.')}</div></section></section>`}
function logWeight(){const w=Number(document.getElementById('weightVal').value),date=document.getElementById('weightDate').value,note=document.getElementById('weightNote').value;if(!w)return;data.weights.unshift({id:id('weight'),weight:w,date:new Date(date+'T12:00:00').toISOString(),note});save();render();toast('Weigh-in logged')}
function deleteWeight(i){data.weights=data.weights.filter(x=>x.id!==i);save();render();toast('Weigh-in deleted')}
function profileNum(k,v){data.profile[k]=Number(v);save();render()}
function history(){const u=data.profile.unit,total=data.sessions.reduce((n,s)=>n+volume(s),0),sets=data.sessions.reduce((n,s)=>n+setsDone(s),0);return `<section class="screen"><div class="hero"><p class="eyebrow">TRAINING LOG</p><h1>EVERY REP COUNTS.</h1></div><div class="history-stats"><article class="card"><i>🏋</i><small>WORKOUTS</small><b>${data.sessions.length}</b></article><article class="card"><i>▥</i><small>TOTAL VOLUME</small><b>${Math.round(total).toLocaleString()}<small>${u}</small></b></article><article class="card"><i>✓</i><small>SETS DONE</small><b>${sets}</b></article></div><section class="section"><div class="section-head"><div><span>ARCHIVE</span><h2>WORKOUT HISTORY</h2></div></div><div class="list">${data.sessions.length?data.sessions.map(s=>`<article id="session-${s.id}" class="card session"><button class="session-summary" onclick="toggleSession('${s.id}')"><span class="date"><b>${new Date(s.startedAt).getDate()}</b><small>${fmtDate(s.startedAt,{month:'short'}).toUpperCase()}</small></span><span class="session-copy"><b>${esc(s.name)}</b><small>${setsDone(s)} sets · ${duration(s.startedAt,s.endedAt)} · ${Math.round(volume(s)).toLocaleString()}${u}</small></span><span>›</span></button><div class="session-detail hide">${s.exercises.map(e=>`<div class="hist-ex"><b>${esc(e.name)}</b><span>${e.sets.filter(x=>x.done).map(x=>`${x.weight}${u} × ${x.reps}`).join(' / ')||'No completed sets'}</span></div>`).join('')}${s.notes?`<p class="muted">“${esc(s.notes)}”</p>`:''}<button class="danger-btn" onclick="deleteSession('${s.id}')">⌫ DELETE WORKOUT</button></div></article>`).join(''):empty('◴','History is empty','Your completed workouts will stack up here.')}</div></section></section>`}
function toggleSession(i){const e=document.getElementById('session-'+i);e.classList.toggle('open');e.querySelector('.session-detail').classList.toggle('hide')}
function deleteSession(i){if(!confirm('Delete this workout from history?'))return;data.sessions=data.sessions.filter(s=>s.id!==i);save();render();toast('Workout deleted')}
function settings(){const u=data.profile.unit;return `<section class="screen"><div class="hero"><p class="eyebrow">YOUR SETUP</p><h1>MAKE IT YOURS.</h1></div><div class="settings"><article class="card settings-card"><div class="settings-title"><i>◉</i><div><small>PROFILE</small><h2>YOUR DETAILS</h2></div></div><label class="full">NAME<input value="${esc(data.profile.name)}" placeholder="What should we call you?" oninput="data.profile.name=this.value;save()"></label><div class="fields"><label>START WEIGHT<input type="number" value="${data.profile.startWeight||''}" onchange="profileNum('startWeight',this.value)"></label><label>TARGET WEIGHT<input type="number" value="${data.profile.targetWeight||''}" onchange="profileNum('targetWeight',this.value)"></label></div><div class="units"><button class="${u==='kg'?'active':''}" onclick="changeUnit('kg')">KILOGRAMS</button><button class="${u==='lb'?'active':''}" onclick="changeUnit('lb')">POUNDS</button></div></article><article class="card settings-card"><div class="settings-title"><i>🏋</i><div><small>ROUTINES</small><h2>YOUR TEMPLATES</h2></div></div>${data.templates.map(t=>`<div class="routine"><div><b>${esc(t.name)}</b><small>${t.exercises.map(esc).join(' · ')}</small></div><span>${t.exercises.length}</span></div>`).join('')}<button class="secondary" onclick="routineBuilder()">＋ CREATE ROUTINE</button></article><article class="card settings-card"><div class="settings-title"><i>↗</i><div><small>YOUR DATA</small><h2>BACKUP & RESTORE</h2></div></div><p class="muted">Everything is stored privately in this browser. Export a backup before changing phones or clearing browser data.</p><div class="actions"><button class="secondary" onclick="exportData()">↗ EXPORT</button><button class="secondary" onclick="document.getElementById('importFile').click()">↥ IMPORT</button></div><input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(this.files[0])"></article><article class="card settings-card"><div class="settings-title"><i>↻</i><div><small>DANGER ZONE</small><h2>RESET APP</h2></div></div><button class="danger-btn" onclick="resetData()">⌫ ERASE ALL LOCAL DATA</button></article></div></section>`}
function changeUnit(n){const old=data.profile.unit;if(old===n)return;const f=n==='lb'?2.2046226218:1/2.2046226218,dataWeight=v=>v?Math.round(v*f*10)/10:0;data.profile.startWeight=dataWeight(data.profile.startWeight);data.profile.targetWeight=dataWeight(data.profile.targetWeight);data.weights=data.weights.map(x=>({...x,weight:dataWeight(x.weight)}));data.sessions=data.sessions.map(s=>({...s,exercises:s.exercises.map(e=>({...e,sets:e.sets.map(x=>({...x,weight:dataWeight(x.weight)}))}))}));if(active)active.exercises=active.exercises.map(e=>({...e,sets:e.sets.map(x=>({...x,weight:dataWeight(x.weight)}))}));data.profile.unit=n;save();render();toast('Switched to '+n)}
function routineBuilder(){modal('BUILD A ROUTINE','Save it once. Run it whenever.',`<div class="builder"><label>ROUTINE NAME<input id="rName" value="MY ROUTINE"></label><label>FOCUS<input id="rFocus" value="Custom training day"></label><label>ADD EXERCISE<div class="inline"><input id="rExercise" placeholder="e.g. Hack Squat" onkeydown="if(event.key==='Enter'){event.preventDefault();addRoutineExercise()}"><button onclick="addRoutineExercise()">＋</button></div></label><div id="rList" class="builder-list"></div><button class="primary" onclick="saveRoutine()">✓ SAVE ROUTINE</button></div>`);window.rExercises=[]}
function addRoutineExercise(){const e=document.getElementById('rExercise'),n=e.value.trim();if(!n)return;rExercises.push(n);e.value='';renderRoutineList()}
function renderRoutineList(){document.getElementById('rList').innerHTML=rExercises.map((n,i)=>`<div><span>${i+1}</span><b>${esc(n)}</b><button onclick="rExercises.splice(${i},1);renderRoutineList()">✕</button></div>`).join('')}
function saveRoutine(){const name=document.getElementById('rName').value.trim(),focus=document.getElementById('rFocus').value.trim();if(!name||!rExercises.length){toast('Add a name and exercise');return}data.templates.push({id:id('template'),name:name.toUpperCase(),focus,exercises:[...rExercises]});save();closeModal();render();toast('Routine saved')}
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gym-buddy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}
async function importData(f){if(!f)return;try{const p=JSON.parse(await f.text());if(!p.profile||!Array.isArray(p.sessions)||!Array.isArray(p.weights))throw Error();data={...defaults,...p,profile:{...defaults.profile,...p.profile}};save();render();toast('Backup restored')}catch{alert('That is not a valid Gym Buddy backup.')}}
function resetData(){if(!confirm('Erase every workout, weigh-in and setting on this device?'))return;data=structuredClone(defaults);active=null;save();go('home');toast('All local data cleared')}
function modal(title,sub,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><section class="modal"><header><div><p class="eyebrow">GYM BUDDY</p><h2>${title}</h2><span>${sub}</span></div><button class="icon-btn" onclick="closeModal()">✕</button></header><div class="modal-body">${body}</div></section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
updateTop();go('home');
</script>
</body>
</html>

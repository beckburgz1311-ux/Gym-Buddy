<script>

 {id:'u1',title:'Python Foundations',desc:'Learn how code stores information and talks back.',lessons:[

   {type:'choice',prompt:'What is printed?',code:'hearts = 0\nif hearts > 0:\n    print("Keep going")\nelse:\n    print("Try again")',options:['Keep going','Try again','Both','Nothing'],answer:1,why:'hearts > 0 is False, so the else block runs.'},
   {type:'code',prompt:'Write the first line of an if statement that checks age is at least 18.',answer:'if age >= 18:',why:'The colon starts the indented block that belongs to the condition.'}

const STORE='codetrail-progress-v1';
const defaultState={xp:0,hearts:5,streak:0,lastStudy:null,completed:[],dailyXP:0,dailyDate:null,sound:true,lesson:null};
let state=load();let currentTab='home';let activeLesson=null;let challengeIndex=0;let selected=null;let checked=false;let mistakes=0;
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return {...defaultState}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));updateTop()}
function today(){return new Date().toISOString().slice(0,10)}
function dateDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function updateDaily(){if(state.dailyDate!==today()){state.dailyDate=today();state.dailyXP=0}}
function updateTop(){updateDaily();document.getElementById('xpTop').textContent=state.xp;document.getElementById('heartsTop').textContent=state.hearts;document.getElementById('streakTop').textContent=state.streak;saveQuiet()}
function saveQuiet(){localStorage.setItem(STORE,JSON.stringify(state))}
function allLessons(){return COURSE.flatMap(u=>u.lessons)}
function completedCount(){return state.completed.length}
function lessonUnlocked(id){const lessons=allLessons();const idx=lessons.findIndex(x=>x.id===id);return idx===0||state.completed.includes(id)||state.completed.includes(lessons[idx-1].id)}
function lessonById(id){return allLessons().find(x=>x.id===id)}
function nextLesson(){return allLessons().find(x=>lessonUnlocked(x.id)&&!state.completed.includes(x.id))||allLessons()[0]}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function codeHtml(code=''){return escapeHtml(code).replace(/\b(def|if|else|for|in|return|True|False|and|or|not)\b/g,'<span class="kw">$1</span>').replace(/\b(print|range|int)\b/g,'<span class="fn">$1</span>').replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g,'<span class="str">$1</span>').replace(/\b\d+\b/g,'<span class="num">$&</span>')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function setChrome(inLesson){document.getElementById('topBar').classList.toggle('hidden',inLesson);document.getElementById('nav').classList.toggle('hidden',inLesson)}
function render(){updateDaily();updateTop();setChrome(false);if(currentTab==='home')renderHome();if(currentTab==='practice')renderPractice();if(currentTab==='profile')renderProfile();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
function renderHome(){const next=nextLesson();const goal=50;const pct=Math.min(100,Math.round(state.dailyXP/goal*100));document.getElementById('app').innerHTML=`
<section class="screen"><div class="hero"><p class="eyebrow">Your coding journey</p><h1>Learn Python one win at a time.</h1><p>Short lessons, instant feedback and a clear trail from your first line of code to functions and loops.</p><div class="hero-actions"><button class="primary" data-start="${next.id}">${state.completed.includes(next.id)?'Practise again':'Continue lesson'}</button><button class="secondary" data-scroll-path>View learning path</button></div></div>
<div class="section"><div class="daily card"><div class="daily-head"><strong>Daily goal</strong><span>${state.dailyXP} / ${goal} XP</span></div><div class="progress"><i style="width:${pct}%"></i></div><p>${pct>=100?'Goal smashed. Anything else today is bonus XP.':'Complete lessons to keep your streak moving.'}</p></div></div>
<div class="section" id="learningPath"><div class="section-title"><h2>Python path</h2><span>${completedCount()} / ${allLessons().length} complete</span></div><div class="path">${COURSE.map((u,ui)=>`<section class="unit"><div class="unit-banner"><small>Unit ${ui+1}</small><h3>${u.title}</h3><p>${u.desc}</p></div><div class="nodes">${u.lessons.map(l=>{const done=state.completed.includes(l.id),open=lessonUnlocked(l.id),current=open&&!done;return `<button class="lesson-node ${done?'complete':''} ${current?'current':''} ${!open?'locked':''}" ${current?'style="--x:-45px"':''} data-start="${l.id}" ${!open?'disabled':''}>${done?'✓':open?l.icon:'🔒'}<span>${l.title}</span></button>`}).join('')}</div></section>`).join('')}</div></div></section>`;bindCommon()}
function renderPractice(){const available=allLessons().filter(l=>lessonUnlocked(l.id));document.getElementById('app').innerHTML=`<section class="screen"><p class="eyebrow">Strengthen your skills</p><div class="hero"><h1>Practice without pressure.</h1><p>Replay any unlocked lesson. Practice restores one heart when you finish, even if you have already earned its main XP reward.</p><div class="hero-actions"><button class="primary" id="smartPractice">Start smart practice</button></div></div><div class="section"><div class="section-title"><h2>Unlocked lessons</h2><span>${available.length} available</span></div><div class="achievement-list">${available.map(l=>`<button class="achievement card" data-start="${l.id}" style="text-align:left;color:inherit"><span class="icon">${l.icon}</span><span><b>${l.title}</b><small>${state.completed.includes(l.id)?'Completed — replay for practice':'New lesson ready'}</small></span><em>${l.xp} XP</em></button>`).join('')}</div></div></section>`;bindCommon();document.getElementById('smartPractice').onclick=()=>startLesson(available[Math.floor(Math.random()*available.length)].id,true)}
function renderProfile(){const achievements=[['First steps','Complete your first lesson','👣',completedCount()>=1],['On a roll','Complete three lessons','🎯',completedCount()>=3],['Python explorer','Complete Unit 1','🐍',COURSE[0].lessons.every(l=>state.completed.includes(l.id))],['Century club','Earn 100 XP','💯',state.xp>=100],['Trail master','Complete the full course','🏆',completedCount()===allLessons().length]];document.getElementById('app').innerHTML=`<section class="screen"><p class="eyebrow">Your progress</p><div class="hero"><h1>Keep building momentum.</h1><p>Your progress is saved privately on this device. No account or sign-in is required.</p></div><div class="section"><div class="stats-grid"><div class="stat-card card"><i>⚡</i><strong>${state.xp}</strong><span>Total XP</span></div><div class="stat-card card"><i>🔥</i><strong>${state.streak}</strong><span>Day streak</span></div><div class="stat-card card"><i>✓</i><strong>${completedCount()}</strong><span>Lessons done</span></div><div class="stat-card card"><i>♥</i><strong>${state.hearts}</strong><span>Hearts left</span></div></div></div><div class="section"><div class="section-title"><h2>Achievements</h2></div><div class="achievement-list">${achievements.map(a=>`<div class="achievement card ${a[3]?'unlocked':''}"><span class="icon">${a[2]}</span><span><b>${a[0]}</b><small>${a[1]}</small></span><em>${a[3]?'Unlocked':'Locked'}</em></div>`).join('')}</div></div><div class="section"><div class="section-title"><h2>Settings</h2></div><div class="settings"><div class="setting card"><span><b>Sound feedback</b><small>Small tones for correct and incorrect answers</small></span><button class="toggle ${state.sound?'on':''}" id="soundToggle"><i></i></button></div><div class="setting card"><span><b>Reset progress</b><small>Clear XP, lessons, hearts and streak on this device</small></span><button class="secondary" id="resetBtn">Reset</button></div></div></div></section>`;document.getElementById('soundToggle').onclick=()=>{state.sound=!state.sound;save();renderProfile()};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all CodeTrail progress?')){state={...defaultState};save();render()}}}
function bindCommon(){document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startLesson(b.dataset.start,false));document.querySelector('[data-scroll-path]')?.addEventListener('click',()=>document.getElementById('learningPath').scrollIntoView({behavior:'smooth'}))}
function startLesson(id,practice=false){if(!lessonUnlocked(id))return toast('Complete the previous lesson first.');if(state.hearts<=0&&!practice)return toast('No hearts left. Use Practice to restore one.');activeLesson={...lessonById(id),practice};challengeIndex=0;selected=null;checked=false;mistakes=0;setChrome(true);renderChallenge()}
function renderChallenge(){const c=activeLesson.challenges[challengeIndex];const pct=Math.round(challengeIndex/activeLesson.challenges.length*100);document.getElementById('app').innerHTML=`<section class="screen lesson-shell"><div class="lesson-top"><button class="close" id="closeLesson">×</button><div class="lesson-progress"><i style="width:${pct}%"></i></div><span class="lesson-heart">♥ ${state.hearts}</span></div><div class="challenge"><span class="challenge-type">${c.type==='choice'?'Choose the answer':c.type==='input'?'Fill the blank':'Write the code'}</span><h2>${escapeHtml(c.prompt)}</h2>${c.code?`<pre class="code">${codeHtml(c.code)}</pre>`:''}<p class="explain">${c.type==='code'?'Spacing around operators is flexible. Capital letters and punctuation still matter.':'Take your time — accuracy beats speed.'}</p>${challengeInput(c)}<button class="hint" id="hintBtn">💡 Show a hint</button></div><div class="lesson-footer"><div id="feedback"></div><button class="check" id="checkBtn" ${c.type==='choice'?'disabled':''}>Check answer</button></div></section>`;document.getElementById('closeLesson').onclick=closeLesson;document.getElementById('hintBtn').onclick=()=>toast(c.hint||'Look closely at the code and the lesson wording.');bindChallenge(c)}
function challengeInput(c){if(c.type==='choice')return `<div class="options">${c.options.map((o,i)=>`<button class="option" data-option="${i}">${escapeHtml(o)}</button>`).join('')}</div>`;if(c.type==='input')return `<div class="answer-box"><input id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing code"></div>`;return `<div class="answer-box"><textarea id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Write your Python here"></textarea></div>`}
function bindChallenge(c){const check=document.getElementById('checkBtn');if(c.type==='choice'){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(checked)return;selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>x.classList.toggle('selected',x===b));check.disabled=false})}else{const input=document.getElementById('answerInput');input.addEventListener('input',()=>check.disabled=!input.value.trim());input.addEventListener('keydown',e=>{if(e.key==='Enter'&&c.type==='input'&&!e.shiftKey&&input.value.trim()){e.preventDefault();check.click()}});setTimeout(()=>input.focus(),40);check.disabled=true}check.onclick=()=>checked?nextChallenge():checkAnswer(c)}
function normalize(s){return String(s).trim().replace(/\s+/g,' ').replace(/\s*([=+*<>!,():])\s*/g,'$1').replace(/;$/,'')}
function checkAnswer(c){let correct=false;let answerValue='';if(c.type==='choice'){correct=selected===c.answer}else{answerValue=document.getElementById('answerInput').value;const accepted=[c.answer,...(c.alternatives||[])].map(normalize);correct=accepted.includes(normalize(answerValue))}checked=true;const feedback=document.getElementById('feedback');const check=document.getElementById('checkBtn');if(correct){feedback.className='feedback good';feedback.textContent='Correct! '+c.why;check.textContent=challengeIndex===activeLesson.challenges.length-1?'Finish lesson':'Continue';check.classList.add('next');playTone(true);if(c.type==='choice')document.querySelector(`[data-option="${selected}"]`).classList.add('correct')}else{mistakes++;state.hearts=Math.max(0,state.hearts-1);save();feedback.className='feedback bad';feedback.textContent='Not quite. '+c.why;check.textContent=state.hearts===0&&!activeLesson.practice?'See result':'Continue';check.classList.add('next');playTone(false);if(c.type==='choice'){document.querySelector(`[data-option="${selected}"]`)?.classList.add('wrong');document.querySelector(`[data-option="${c.answer}"]`)?.classList.add('correct')}document.querySelector('.lesson-heart').textContent='♥ '+state.hearts}}
function nextChallenge(){if(state.hearts===0&&!activeLesson.practice)return finishLesson(false);if(challengeIndex<activeLesson.challenges.length-1){challengeIndex++;selected=null;checked=false;renderChallenge()}else finishLesson(true)}
function finishLesson(success){const first=!state.completed.includes(activeLesson.id);let earned=0;if(success){earned=activeLesson.practice?10:(first?activeLesson.xp:10);state.xp+=earned;state.dailyXP+=earned;if(first)state.completed.push(activeLesson.id);if(activeLesson.practice)state.hearts=Math.min(5,state.hearts+1);updateStreak();save()}setChrome(true);document.getElementById('app').innerHTML=`<section class="screen complete-screen"><div class="complete-badge">${success?'🏆':'♥'}</div><h1>${success?'Lesson complete!':'Out of hearts'}</h1><p>${success?`You finished ${escapeHtml(activeLesson.title)}${mistakes?` with ${mistakes} mistake${mistakes===1?'':'s'}`:' without losing a heart'}.`:'Use Practice mode to restore a heart, then return to the trail.'}</p><div class="rewards"><div class="reward"><strong>+${earned}</strong><span>XP earned</span></div><div class="reward"><strong>${state.streak}</strong><span>Day streak</span></div><div class="reward"><strong>${state.hearts}</strong><span>Hearts</span></div></div><button class="primary" id="doneLesson">${success?'Back to trail':'Go to practice'}</button></section>`;document.getElementById('doneLesson').onclick=()=>{currentTab=success?'home':'practice';activeLesson=null;render()}}
function updateStreak(){const t=today();if(!state.lastStudy){state.streak=1}else{const d=dateDiff(state.lastStudy,t);if(d===1)state.streak++;else if(d>1)state.streak=1}state.lastStudy=t}
function closeLesson(){if(confirm('Leave this lesson? Your current answer will not be saved.')){activeLesson=null;render()}}
function playTone(ok){if(!state.sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:190;g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.start();o.stop(ctx.currentTime+.17)}catch{}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render();scrollTo(0,0)});document.querySelector('[data-go="home"]').onclick=()=>{currentTab='home';render();scrollTo(0,0)};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
